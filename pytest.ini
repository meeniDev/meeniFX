[pytest]
testpaths = tests
addopts = -ra
# A hung Qt/MediaPipe teardown must fail instead of stalling the whole run.
# pytest-timeout is required for this setting (see the stabilization report).
timeout = 180
timeout_method = thread
markers =
    unit: model, editing and utility tests without a real window
    renderer: compositor, effects, generated layers, export and cache tests
    gui: tests that construct real Qt windows or widgets
    model: optional U^2-Net / Roto Brush integration tests (some skip without weights)
    packaged: frozen-application and packaging tests
