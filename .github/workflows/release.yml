name: Windows release

# Ordinary pushes never build a release. Pushing a version tag (v0.1.0-alpha.2) or running
# the workflow manually does. A manual run without a tag only produces artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r meenifx/requirements.txt
          python -m pip install "pyinstaller==6.11.1"

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: >-
          python -m pytest tests -q -p no:cacheprovider
          --ignore=tests/test_project_app.py
          --ignore=tests/test_project_large.py
          --ignore=tests/test_project_panel.py
          --ignore=tests/test_start_window.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer, portable ZIP and checksums
        run: python packaging/build_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: meeniFX-windows
          path: |
            dist/meeniFX-Studios-*-Windows-Setup.exe
            dist/meeniFX-Studios-*-Windows-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish assets to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = python -c "from meenifx.version import VERSION; print(VERSION)"
          $tag = "$env:GITHUB_REF_NAME"
          $notes = "docs/releases/$version.md"
          $assets = @(
            "dist/meeniFX-Studios-$version-Windows-Setup.exe",
            "dist/meeniFX-Studios-$version-Windows-Portable.zip",
            "dist/SHA256SUMS.txt"
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY `
              --title "meeniFX Studios $version" --notes-file $notes --prerelease --verify-tag
          }
